name: Gerar APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - name: Ler versão e renomear
        run: |
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "VER=$VER" >> $GITHUB_ENV
          cp app/build/outputs/apk/debug/app-debug.apk "RadioRelogioDoDaniel-v$VER.apk"
          cp app/src/main/assets/index.html "RadioRelogioDoDaniel-v$VER.html"
      - uses: actions/upload-artifact@v4
        with: { name: RadioRelogioDoDaniel-v${{ env.VER }}, path: "RadioRelogioDoDaniel-v*" }
      - name: Publicar versão para baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Rádio Relógio do Daniel ${{ env.VER }}
          make_latest: true
          files: |
            RadioRelogioDoDaniel-v${{ env.VER }}.apk
            RadioRelogioDoDaniel-v${{ env.VER }}.html
